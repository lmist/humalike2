# Alembic configuration for the Humalike API recreation.
#
# The URL is intentionally left blank: alembic/env.py reads
# HUMALIKE_DATABASE_URL through humalike.config.settings so migrations and the
# running service can never disagree about which database they address
# (spec/06 §Durable state). Override for a one-off target with:
#
#   alembic -x url=sqlite:///./scratch.db upgrade head
#
# Rollback commands per phase live in docs/runbooks/rollback.md.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
