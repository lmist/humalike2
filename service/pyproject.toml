[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humalike-recreation"
version = "0.1.0"
description = "Clean-room recreation of the Humalike API (spec/ is normative; tests/realtime and tests/intelligence are the live conformance oracle)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "websockets>=12", "alembic>=1.13"]

[tool.setuptools.packages.find]
include = ["humalike*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
